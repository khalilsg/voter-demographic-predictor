name: Deploy to GitHub Pages

# The site is a static build of committed coefficient files, so a push to main
# is all it takes. No data is fetched at build time and none at runtime.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; skip superseded queued
# ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A repository whose Pages source is a BRANCH ignores this workflow's
      # artifact entirely and serves the repo root through Jekyll instead —
      # which renders README.md as the homepage. Both builds run, both go
      # green, and the wrong one wins. That is a silent failure worth turning
      # into a loud one, because the deploy job cannot detect it: it uploads
      # and "succeeds" while nothing it produced is served.
      - name: Verify Pages builds from Actions, not from a branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" \
            --jq '.build_type' 2>/dev/null || echo "none")
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages source is '$build_type', not 'workflow'."
            echo "GitHub is serving the repository root with Jekyll and ignoring this build."
            echo "Fix once, in the repository settings:"
            echo "  Settings -> Pages -> Build and deployment -> Source -> GitHub Actions"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is only worth publishing if the engine is sound and no
      # microdata slipped into the repo, so both gate the deploy.
      - run: npm test
      - run: npm run typecheck

      - name: Fail if the models are still placeholders
        run: |
          if grep -l '"synthetic": true' data/models/*.json > /dev/null 2>&1; then
            echo "::error::data/models still holds placeholder coefficients."
            echo "Run scripts/fit_models.py and commit the result before deploying."
            exit 1
          fi

      - run: npm run build

      # enablement: true CREATES the Pages site when there is none, which is
      # what got the first deploy past "Get Pages site failed". It does not
      # change the source of a site that already exists — a repository already
      # publishing from a branch keeps doing so, which is what the check above
      # exists to catch.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
